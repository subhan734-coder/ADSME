name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download ngrok
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile "ngrok.zip"

      - name: Extract ngrok
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\ngrok"
          Expand-Archive -Path ".\ngrok.zip" -DestinationPath ".\ngrok" -Force

      - name: Authenticate ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          .\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN

      - name: Enable Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $Password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          Set-LocalUser -Name "runneradmin" -Password $Password

      - name: Create Tunnel
        shell: pwsh
        run: |
          .\ngrok\ngrok.exe tcp 3389
